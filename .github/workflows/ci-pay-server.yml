name: CI pay-server

on:
  pull_request:
    paths:
      - 'pay-server/**'
      - 'core/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          extensions: pdo, pdo_pgsql, gmp

      - name: Install core dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist

      - name: Install pay-server dependencies
        working-directory: pay-server
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP syntax
        run: find pay-server core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run pay-server test suite
        working-directory: pay-server
        run: vendor/bin/phpunit
