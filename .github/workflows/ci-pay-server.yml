name: CI pay-server

on:
  pull_request:
    paths:
      - 'pay-server/**'
      - 'core/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          extensions: pdo, pdo_pgsql, gmp

      - name: Validate core composer.json
        working-directory: core
        run: composer validate --no-check-publish

      # Deliberately not running `composer install` inside core/ on its own:
      # core/README.md, "Using it from a new adapter" explains why the
      # bitwasp/bitcoin -> lastguest/murmurhash PHP-8 workaround only takes
      # effect from the *consuming* project's own root composer.json
      # (Composer's inline-alias syntax has no effect inside a dependency's
      # own composer.json). Installing core/ standalone here would resolve
      # against the unaliased lastguest/murmurhash 2.0.0, which requires
      # PHP ^7 and fails on this job's PHP 8.2. pay-server/composer.json
      # carries that alias itself (matching osclass-escrow/composer.json's
      # own working pattern), and its path repository on ../core pulls
      # core in correctly as part of the same install below.
      - name: Install pay-server dependencies
        working-directory: pay-server
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP syntax
        run: find pay-server core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run pay-server test suite
        working-directory: pay-server
        run: vendor/bin/phpunit
