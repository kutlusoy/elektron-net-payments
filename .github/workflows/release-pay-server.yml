name: Release pay-server

# Tag as pay-v1.2.3 to build and publish the pay-api and pay-watcher
# images, or run manually for a throwaway build. Scoped to its own tag
# prefix, matching the existing one-release-workflow-per-adapter
# convention (see release-osclass-escrow.yml), so this workflow can never
# build or publish the Osclass plugin and vice versa.
on:
  push:
    tags:
      - 'pay-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the images with (e.g. 0.1.0-rc1)'
        required: true
        default: '0.0.0-manual'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [pay-api, pay-watcher]
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "value=${tag#pay-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: pay-server/docker/Dockerfile.${{ matrix.image }}
          push: ${{ startsWith(github.ref, 'refs/tags/pay-v') }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest

      - name: Create GitHub Release
        if: matrix.image == 'pay-api' && startsWith(github.ref, 'refs/tags/pay-v')
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "pay-server ${{ steps.version.outputs.value }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
